<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrossList — Inventory</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#17243c;font:15px system-ui,Arial,sans-serif}header{background:#142139;color:white;padding:22px max(20px,calc((100vw - 1100px)/2))}h1{margin:0;font-size:26px}header small{color:#bdcce2}main{max-width:1100px;margin:28px auto;padding:0 20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.box{background:white;border:1px solid #e0e7ef;border-radius:14px;padding:20px;margin-bottom:18px}.stats strong{display:block;font-size:27px;margin-top:5px}h2{font-size:19px;margin:0 0 16px}label{display:block;font-size:13px;font-weight:650;margin-bottom:5px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}input,textarea,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:9px 13px;font-weight:650;cursor:pointer}button.alt{background:#e8edf7;color:#263850}button.red{background:#b92337}button:disabled{opacity:.45;cursor:not-allowed}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top input{max-width:300px}.item{border-top:1px solid #e6ebf2;padding:17px 0}.item:first-child{border-top:0}.itemhead{display:flex;justify-content:space-between;gap:10px}.muted{color:#64748b}.tag{display:inline-block;padding:3px 9px;background:#eaf0fc;border-radius:20px;margin:4px 4px 0 0;font-size:12px}.tag.warn{background:#ffefc4}.tag.sold{background:#fce4e7}.links{font-size:13px;margin-top:9px}.links>div{margin-top:7px}.hidden{display:none}#message{min-height:24px;color:#a21d32;padding-top:8px}footer{color:#758197;font-size:12px;margin:20px 0}@media(max-width:650px){.stats,.fields{grid-template-columns:1fr}.itemhead{display:block}}
</style></head><body><header><h1>CrossList <small>Inventory hub</small></h1></header><main>
<div class="stats"><section class="box"><div class="muted">Products</div><strong id="products">0</strong></section><section class="box"><div class="muted">Stock available</div><strong id="stock">0</strong></section><section class="box"><div class="muted">Listings needing action</div><strong id="actions">0</strong></section></div>
<section class="box"><h2 id="formTitle">Add new item</h2><form id="form"><div class="fields"><div><label>SKU</label><input name="sku" required maxlength="80" placeholder="ITEM-001"></div><div><label>Title</label><input name="title" required maxlength="200" placeholder="Vintage jacket"></div><div><label>Price (£)</label><input name="price" type="number" min="0" step="0.01" required value="0"></div><div><label>Quantity</label><input name="quantity" type="number" min="0" step="1" required value="1"></div><div class="full"><label>Description</label><textarea name="description" rows="2"></textarea></div></div><div class="controls"><button type="submit">Save item</button><button class="alt hidden" type="button" id="cancel">Cancel edit</button></div></form><div id="message" role="alert"></div></section>
<section class="box"><div class="top"><h2>Inventory</h2><input id="search" aria-label="Search inventory" placeholder="Search SKU or title"></div><div id="items" class="muted">Loading...</div></section>
<footer>Manual tracking only: linking a listing does not publish it, and marking an item sold does not end it on the marketplace.</footer></main>
<script>
const el=id=>document.getElementById(id);let all=[],edit=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=p=>'£'+(p/100).toFixed(2);
async function api(path,method='GET',data){const res=await fetch(path,{method,headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const obj=await res.json();if(!res.ok)throw Error(typeof obj.detail==='string'?obj.detail:JSON.stringify(obj.detail));return obj}
const message=t=>el('message').textContent=t;
async function reload(){try{all=await api('/api/items');render()}catch(e){message(e.message)}}
function render(){const q=el('search').value.toLowerCase();el('products').textContent=all.length;el('stock').textContent=all.reduce((s,i)=>s+(i.status==='available'?i.quantity:0),0);el('actions').textContent=all.flatMap(i=>i.listings).filter(l=>l.status==='action_required').length;
const matched=all.filter(i=>(i.sku+' '+i.title).toLowerCase().includes(q));
el('items').innerHTML=matched.length?matched.map(i=>`<div class="item"><div class="itemhead"><div><strong>${esc(i.title)}</strong><div class="muted">${esc(i.sku)} · ${money(i.price_pence)} · Qty ${i.quantity}</div><span class="tag ${i.status==='sold'?'sold':''}">${i.status}</span></div><div class="controls"><button class="alt" data-action="edit" data-id="${i.id}" ${i.status==='sold'?'disabled':''}>Edit</button><button class="alt" data-action="link" data-id="${i.id}">Link listing</button><button class="red" data-action="sell" data-id="${i.id}" ${i.status==='sold'?'disabled':''}>Mark sold</button></div></div><div class="links">${i.listings.length?i.listings.map(l=>`<div>${esc(l.marketplace)} · ${money(l.price_pence)} · <span class="tag ${l.status==='action_required'?'warn':''}">${l.status}</span> ${l.url?`<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">Open listing</a>`:''} ${l.status==='action_required'?`<button class="alt" data-action="ended" data-id="${l.id}">I ended it</button>`:''}</div>`).join(''):'No linked listings'}</div></div>`).join(''):'No items yet'}
el('search').oninput=render;
function resetForm(){edit=null;el('form').reset();el('formTitle').textContent='Add new item';el('cancel').classList.add('hidden')}
el('cancel').onclick=resetForm;
el('form').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.currentTarget);const data={sku:String(f.get('sku')),title:String(f.get('title')),description:String(f.get('description')),price_pence:Math.round(Number(f.get('price'))*100),quantity:Number(f.get('quantity'))};try{await api(edit?`/api/items/${edit}`:'/api/items',edit?'PUT':'POST',data);resetForm();message('Saved');await reload()}catch(e){message(e.message)}};
el('items').onclick=async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const id=Number(b.dataset.id),a=b.dataset.action;try{
if(a==='edit'){const i=all.find(i=>i.id===id);edit=id;const f=el('form').elements;f.sku.value=i.sku;f.title.value=i.title;f.price.value=(i.price_pence/100).toFixed(2);f.quantity.value=i.quantity;f.description.value=i.description;el('formTitle').textContent='Edit '+i.sku;el('cancel').classList.remove('hidden');window.scrollTo(0,0)}
if(a==='sell'){if(!confirm('Mark sold? You must manually end live listings on other marketplaces.'))return;const r=await api(`/api/items/${id}/sold`,'POST');message('Marked sold. '+r.action_required+' marketplace listings need manual ending.');await reload()}
if(a==='ended'){await api(`/api/listings/${id}/status`,'PATCH',{status:'ended'});message('Marked as ended in CrossList');await reload()}
if(a==='link'){const marketplace=prompt('Marketplace: ebay, vinted, depop, facebook, other','ebay');if(!marketplace)return;const url=prompt('Listing URL (optional)','');if(url===null)return;const status=prompt('Status: draft, live, ended','live');if(!status)return;const i=all.find(i=>i.id===id);await api(`/api/items/${id}/listings`,'POST',{marketplace:marketplace.trim().toLowerCase(),url:url.trim(),status:status.trim().toLowerCase(),price_pence:i.price_pence});message('Listing linked');await reload()}
}catch(err){message(err.message)}};reload();
</script></body></html>
